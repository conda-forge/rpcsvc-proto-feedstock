context:
  version: "1.4.4"

package:
  name: rpcsvc-proto
  version: ${{ version }}

source:
  url: https://github.com/thkukuk/rpcsvc-proto/releases/download/v${{ version }}/rpcsvc-proto-${{ version }}.tar.xz
  sha256: 81c3aa27edb5d8a18ef027081ebb984234d5b5860c65bd99d4ac8f03145a558b
  patches:
    # TODO: drop once upstream includes PR #14 in a release.
    - 0001-rpcgen-follow-the-CPP-and-RPCGEN_CPP-enviromental-va.patch

build:
  number: 1
  skip:
    - win
  script:
    - autoreconf -fi
    - if [[ "${CONDA_BUILD_CROSS_COMPILATION:-0}" == "1" ]]; then CROSS_ARGS="--build=${BUILD} --host=${HOST}"; fi
    - ./configure --prefix=$PREFIX ${CROSS_ARGS:-}
    # The rpcsvc headers are made by running the rpcgen just built
    # (rpcsvc/Makefile.am: $(top_builddir)/rpcgen/rpcgen -h -o $@ $<).
    # Cross-compiled, that rpcgen is for the target and cannot run here: make
    # them first, same command, with the build machine's rpcgen; make then finds
    # them up to date. The installed rpcgen is still the one built for the target.
    - |
      if [[ "${CONDA_BUILD_CROSS_COMPILATION:-0}" == "1" ]]; then
        for x in rpcsvc/*.x; do
          "${BUILD_PREFIX}/bin/rpcgen" -h -o "${x%.x}.h" "$x"
        done
      fi
    - make
    - make install

requirements:
  build:
    - ${{ compiler('c') }}
    - if: build_platform != target_platform
      then:
        - rpcsvc-proto
    - ${{ stdlib('c') }}
    - autoconf
    - automake
    - libtool
    - make
    - gettext
  host:
    - if: osx
      then:
        - libintl

tests:
  - script:
      - rpcgen -h 2>&1 | grep -q rpcgen

about:
  homepage: https://github.com/thkukuk/rpcsvc-proto
  summary: rpcsvc protocol files and rpcgen, removed from glibc in favour of libtirpc
  description: |
    rpcsvc-proto provides the rpcsvc protocol files and headers that were formerly
    distributed with glibc, along with the rpcgen program for generating C code
    from RPC protocol definitions. It is the upstream replacement recommended by
    distributions such as Debian, Fedora, and SUSE for software that needs to
    build against Sun RPC.
  license: MIT
  license_file: COPYING
  repository: https://github.com/thkukuk/rpcsvc-proto

extra:
  recipe-maintainers:
    - meiyasan
    - anderslindho
